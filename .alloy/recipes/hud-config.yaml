name: hud-config
graph: fast-track

# Configuration and cleanup use real checks rather than tests mirroring prose/YAML.
roles:
  implement:
    runner: codex
    model: gpt-6.1-sol
    effort: medium
    timeout_minutes: 25
  harvest: &reviewer
    runner: codex-readonly
    model: gpt-6.1-sol
    effort: medium
    timeout_minutes: 10
  triage: *reviewer
  scope: *reviewer
  memory_reviewer: *reviewer

verification:
  max_checks_per_iteration: 5
  max_total_checks: 15
  max_command_timeout_minutes: 15
limits:
  max_iterations: 4
  max_consiliums: 0
  max_wall_time_minutes: 45
  max_agent_calls: 10
