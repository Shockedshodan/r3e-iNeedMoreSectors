name: hud-tdd-high
graph: tdd-loop-sol-no-context

# Evidence reconciliation and authorization merit high effort, without max/ultra.
sessions:
  branch_from_tests: false
roles:
  tests: &writer
    runner: codex
    model: gpt-6.1-sol
    effort: high
    timeout_minutes: 25
  implement: *writer
  tests_review: &reviewer
    runner: codex-readonly
    model: gpt-6.1-sol
    effort: high
    timeout_minutes: 15
  verifier: *reviewer
  acceptance: *reviewer
  judge: *reviewer
  estimate: &classifier
    runner: codex-readonly
    model: gpt-6.1-sol
    effort: medium
    timeout_minutes: 10
  triage: *classifier
  scope: *reviewer
  harvest: *classifier
  memory_reviewer: *classifier

verification:
  max_checks_per_iteration: 5
  max_total_checks: 20
  max_command_timeout_minutes: 15
  max_baseline_repairs: 2
  max_test_reviews: 2
  min_acceptance_confidence: 0.6
limits:
  max_iterations: 5
  max_consiliums: 0
  max_wall_time_minutes: 90
  max_agent_calls: 32
  max_cheap_agent_calls: 60
