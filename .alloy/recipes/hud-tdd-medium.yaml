name: hud-tdd-medium
graph: tdd-loop-sol-no-context

# Review/verifier runners differ from the writer, so they start independently.
sessions:
  branch_from_tests: false
roles:
  tests: &writer
    runner: codex
    model: gpt-6.1-sol
    effort: medium
    timeout_minutes: 20
  implement: *writer
  tests_review: &reviewer
    runner: codex-readonly
    model: gpt-6.1-sol
    effort: medium
    timeout_minutes: 10
  verifier: *reviewer
  acceptance: *reviewer
  judge: *reviewer
  estimate: *reviewer
  triage: *reviewer
  scope: *reviewer
  harvest: *reviewer
  memory_reviewer: *reviewer

verification:
  max_checks_per_iteration: 5
  max_total_checks: 20
  max_command_timeout_minutes: 15
  max_baseline_repairs: 2
  max_test_reviews: 2
  min_acceptance_confidence: 0.6
limits:
  max_iterations: 5
  max_consiliums: 0
  max_wall_time_minutes: 90
  max_agent_calls: 24
  max_cheap_agent_calls: 40
